name: Test baseline

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: test-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'spyria/eng-health-tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run test --coverage --coverage-reporter=lcov --coverage-dir=.check/coverage-unit --reporter=junit --reporter-outfile=.check/unit.xml
      - if: always()
        run: bun run test:integration --coverage --coverage-reporter=lcov --coverage-dir=.check/coverage-integration
      - if: always()
        run: bun scripts/test-timings.ts unit.xml integration.xml | bash .github/notices.sh timings
      - if: always()
        run: |
          for layer in unit integration; do
            { bun scripts/test-coverage.ts compare "$layer" ".check/coverage-$layer/lcov.info" || true; } > "$RUNNER_TEMP/$layer-report.txt"
          done
          cat "$RUNNER_TEMP"/*-report.txt | bash .github/notices.sh coverage
      - if: always()
        run: |
          bun scripts/test-coverage.ts save unit .check/coverage-unit/lcov.info
          gzip -9c tests/baseline/unit.coverage.txt | base64 -w0 | fold -w 7999 | bash .github/notices.sh "unit covered lines"
      - if: always()
        run: |
          bun scripts/test-coverage.ts save integration .check/coverage-integration/lcov.info
          gzip -9c tests/baseline/integration.coverage.txt | base64 -w0 | fold -w 7999 | bash .github/notices.sh "integration covered lines"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          include-hidden-files: true
          path: |
            .check/coverage-*/lcov.info
            .check/*.xml
          retention-days: 30
      - if: failure()
        uses: ./.github/actions/test-stack-logs

  e2e-timings:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'spyria/eng-health-tests')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: bun run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          WORKERS: 2
      - if: always()
        run: bun scripts/test-timings.ts e2e-results.json | bash .github/notices.sh "e2e timings ${{ matrix.shard }}"
