name: Publish manifest

on:
  workflow_call:
    inputs:
      image:
        description: The image name without a tag, for example ghcr.io/owner/spyria-server
        required: true
        type: string
      version:
        description: The version whose amd64 and arm64 tags are joined into one manifest
        required: true
        type: string
      latest:
        description: Whether the manifest is tagged latest too, which a patch of an older release line is not
        required: true
        type: boolean
    outputs:
      digest:
        description: The digest of the multi-architecture manifest
        value: ${{ jobs.manifest.outputs.digest }}

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      LATEST: ${{ inputs.latest }}
    steps:
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: manifest
        run: |
          latest=$([ "$LATEST" = true ] && echo "-t $IMAGE:latest" || true)
          docker buildx imagetools create -t "$IMAGE:$VERSION" $latest "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$IMAGE@$digest"
