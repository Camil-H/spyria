name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      unit: ${{ steps.plan.outputs.unit }}
      integration: ${{ steps.plan.outputs.integration }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e-repeat: ${{ steps.plan.outputs.e2eRepeat }}
      docker: ${{ steps.plan.outputs.docker }}
      bundle: ${{ steps.plan.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
          SCOPE: ${{ github.event_name == 'push' && '--full' || '' }}
        run: |
          plan="$RUNNER_TEMP/plan.json"
          bun scripts/check-related.ts --plan "$plan" --base "$BASE" $SCOPE
          {
            echo "plan=$(jq -c 'del(.changedFiles)' "$plan")"
            for suite in unit integration e2e e2eRepeat; do
              echo "$suite=$(jq -r --arg suite "$suite" '.[$suite] != []' "$plan")"
            done
            echo "docker=$(jq -r .docker "$plan")"
            echo "bundle=$(jq -r .bundle "$plan")"
          } >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:boundaries
      - run: bun run check:locks

  unit:
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-suite.ts unit
        env:
          PLAN: ${{ needs.plan.outputs.plan }}

  integration:
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-suite.ts integration
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
      - if: failure()
        uses: ./.github/actions/test-stack-logs

  bundle:
    needs: plan
    if: needs.plan.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check:bundle

  e2e:
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: bun scripts/ci-suite.ts e2e ${{ matrix.shard }}/4
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          WORKERS: 2
      - if: failure()
        uses: ./.github/actions/test-stack-logs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  e2e-repeat:
    needs: plan
    if: needs.plan.outputs.e2e-repeat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: bun scripts/ci-suite.ts e2e-repeat
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          WORKERS: 2
      - if: failure()
        uses: ./.github/actions/test-stack-logs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-repeat
          path: apps/web/test-results
          retention-days: 7

  docker:
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check:docker
      - if: failure()
        uses: ./.github/actions/test-stack-logs

  ci-ok:
    if: always()
    needs: [plan, checks, unit, integration, bundle, e2e, e2e-repeat, docker]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  promote:
    if: github.event_name == 'push'
    needs: ci-ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.MAIN_DEPLOY_KEY }}
      - run: git push origin "$GITHUB_SHA:refs/heads/main"

  report-failure:
    if: always() && github.event_name == 'push' && needs.ci-ok.result == 'failure'
    needs: ci-ok
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed_jobs=$(gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure" and .name != "ci-ok") | "- " + .name')
          body=$(printf 'The full suite failed on `develop` at %s, which includes this pull request:\n\n%s\n\n%s\n' "${GITHUB_SHA:0:12}" "$failed_jobs" "$RUN_URL")
          git rev-list origin/main..HEAD \
            | xargs -I {} gh api "repos/$GITHUB_REPOSITORY/commits/{}/pulls" --jq '.[].number' \
            | sort -u \
            | xargs -I {} gh pr comment {} --body "$body"
