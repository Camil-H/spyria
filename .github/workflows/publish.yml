name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.names.outputs.version }}
      stable: ${{ steps.names.outputs.stable }}
      latest: ${{ steps.names.outputs.latest }}
      images: ${{ steps.names.outputs.images }}
    steps:
      - id: names
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && stable=true || stable=false
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref')
          highest=$(echo "$tags" | sed 's|^refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          [ "$stable" = true ] && [ "$version" = "$highest" ] && latest=true || latest=false
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "images=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"

  agent:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: bun-linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.version.outputs.images }}/spyria-agent:${{ needs.version.outputs.version }}-${{ matrix.arch }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun build --compile --minify --target=${{ matrix.target }} src/main.ts --outfile dist/spyria-agent
        working-directory: apps/agent
      - run: docker build --pull --build-arg "SPYRIA_VERSION=$VERSION" -t spyria-agent:candidate apps/agent
      - run: bun scripts/check-licenses.ts spyria-agent:candidate
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: docker tag spyria-agent:candidate "$IMAGE" && docker push "$IMAGE"

  host:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.version.outputs.images }}/spyria-host:${{ needs.version.outputs.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - env:
          IMAGES: ${{ needs.version.outputs.images }}
          VERSION: ${{ needs.version.outputs.version }}
        run: docker build --pull --build-arg "SPYRIA_IMAGES=$IMAGES" --build-arg "SPYRIA_VERSION=$VERSION" -t "$IMAGE" apps/host && docker push "$IMAGE"

  agent-manifest:
    needs: [version, agent]
    uses: ./.github/workflows/publish-manifest.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image: ${{ needs.version.outputs.images }}/spyria-agent
      version: ${{ needs.version.outputs.version }}
      latest: ${{ needs.version.outputs.latest == 'true' }}

  host-manifest:
    needs: [version, host]
    uses: ./.github/workflows/publish-manifest.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image: ${{ needs.version.outputs.images }}/spyria-host
      version: ${{ needs.version.outputs.version }}
      latest: ${{ needs.version.outputs.latest == 'true' }}

  server:
    needs: [version, agent-manifest]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.version.outputs.images }}/spyria-server:${{ needs.version.outputs.version }}-${{ matrix.arch }}
      AGENT_IMAGE: ${{ needs.version.outputs.images }}/spyria-agent@${{ needs.agent-manifest.outputs.digest }}
      IMAGES: ${{ needs.version.outputs.images }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: |
          docker build --pull --build-arg "SPYRIA_AGENT_IMAGE=$AGENT_IMAGE" --build-arg "SPYRIA_VERSION=$VERSION" --build-arg "SPYRIA_IMAGES=$IMAGES" \
            -f apps/server/Dockerfile -t "$IMAGE" . && docker push "$IMAGE"

  server-manifest:
    needs: [version, server]
    uses: ./.github/workflows/publish-manifest.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image: ${{ needs.version.outputs.images }}/spyria-server
      version: ${{ needs.version.outputs.version }}
      latest: ${{ needs.version.outputs.latest == 'true' }}

  cli:
    needs: [version, server-manifest, host-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      STABLE: ${{ needs.version.outputs.stable }}
      LATEST: ${{ needs.version.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: |
          mkdir -p dist
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --no-compile-autoload-dotenv --no-compile-autoload-bunfig --minify --target="bun-$target" --define "process.env.SPYRIA_CLI_VERSION=\"$VERSION\"" \
              apps/cli/src/main.ts --outfile "dist/spyria-$target"
          done
          (cd dist && sha256sum spyria-* > spyria-checksums.txt)
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: cosign sign-blob --yes --bundle dist/spyria-checksums.txt.sigstore.json dist/spyria-checksums.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([ "$STABLE" = true ] || echo --prerelease)
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --verify-tag --generate-notes --title "Spyria $VERSION" $prerelease --latest="$LATEST"
          gh release upload "v$VERSION" dist/* deploy/install.sh --clobber
