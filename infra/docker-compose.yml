name: spyria

services:
  postgres:
    image: postgres:18
    container_name: spyria-postgres
    command: postgres -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=20 -c max_slot_wal_keep_size=4GB
    environment:
      POSTGRES_USER: spyria
      POSTGRES_PASSWORD: spyria
      POSTGRES_DB: spyria
    ports:
      - 5434:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U spyria -d spyria
      interval: 1s
      retries: 30

  dex:
    image: dexidp/dex:v2.46.1
    container_name: spyria-dex
    command: dex serve /etc/dex/config.yaml
    environment:
      DEX_SESSIONS_ENABLED: true
    ports:
      - 5556:5556
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: wget -qO- http://localhost:5556/dex/.well-known/openid-configuration
      interval: 1s
      retries: 30

  zero-cache:
    image: rocicorp/zero:1.9.0
    container_name: spyria-zero-cache
    profiles: [zero]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZERO_APP_ID: spyria
      ZERO_APP_PUBLICATIONS: spyria_zero
      ZERO_UPSTREAM_DB: postgres://spyria:spyria@postgres:5432/spyria
      ZERO_QUERY_URL: http://host.docker.internal:3000/api/query
      ZERO_MUTATE_URL: http://host.docker.internal:3000/api/mutate
      ZERO_PORT: 4848
      ZERO_CHANGE_STREAMER_PORT: 4849
      ZERO_REPLICA_FILE: /tmp/spyria-replica.db
      ZERO_NUM_SYNC_WORKERS: 1
      ZERO_ADMIN_PASSWORD: spyria-dev
      ZERO_ENABLE_TELEMETRY: false
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 4848:4848
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4848/keepalive').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 1s
      retries: 60

  gateway-database:
    image: postgres:18
    container_name: spyria-gateway-database
    profiles: [gateway]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: spyria
      PGPASSWORD: spyria
      PGDATABASE: postgres
      GATEWAY_DB_PASSWORD: ${SPYRIA_GATEWAY_DB_PASSWORD:-spyria-dev-gateway-db}
    entrypoint: [sh, -ec]
    command:
      - |
        psql -tAc "select 1 from pg_roles where rolname = 'bifrost'" | grep -q 1 || psql -c "create role bifrost login password '$$GATEWAY_DB_PASSWORD'"
        psql -tAc "select 1 from pg_database where datname = 'bifrost'" | grep -q 1 || psql -c "create database bifrost owner bifrost template template0 encoding 'UTF8'"
    restart: 'no'

  gateway:
    image: maximhq/bifrost:v2.3.2@sha256:f5b18826349fe9e1c402c10d19f1cbb5567a3c800ad928580d07f72e69106ec7
    container_name: spyria-gateway
    profiles: [gateway]
    depends_on:
      gateway-database:
        condition: service_completed_successfully
    environment:
      BIFROST_ENCRYPTION_KEY: ${SPYRIA_GATEWAY_ENCRYPTION_KEY:-spyria-dev-gateway-encryption-key}
      BIFROST_SETUP_TOKEN: ${SPYRIA_GATEWAY_SETUP_TOKEN:-spyria-dev-gateway-setup-token}
      BIFROST_ADMIN_USER: ${SPYRIA_GATEWAY_ADMIN_USER:-spyria}
      BIFROST_ADMIN_PASSWORD: ${SPYRIA_GATEWAY_ADMIN_PASSWORD:-spyria-dev-gateway}
      BIFROST_DB_PASSWORD: ${SPYRIA_GATEWAY_DB_PASSWORD:-spyria-dev-gateway-db}
      SPYRIA_GATEWAY_OAUTH_BASE: ${SPYRIA_GATEWAY_OAUTH_BASE:-http://localhost:5173/gateway-oauth}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8180:8080
    volumes:
      - gateway-data:/app/data
      - ./bifrost.json:/app/data/config.json:ro
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:8080/health
      interval: 1s
      retries: 60

volumes:
  postgres-data:
    name: spyria-postgres-data
  gateway-data:
    name: spyria-gateway-data

networks:
  default:
    name: spyria-network
